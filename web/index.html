<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loomlight Worlds</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Loomlight</h1>
      <nav class="tabs">
        <button class="tab-button active" data-tab="worlds">World Selection</button>
        <button class="tab-button" data-tab="map">Map</button>
        <button class="tab-button" data-tab="locale">Locale</button>
        <button class="tab-button" data-tab="biomes">Biomes</button>
        <button class="tab-button" data-tab="character" disabled>Character</button>
        <button class="tab-button" data-tab="quests" disabled>Quests</button>
      </nav>
      <div class="controls">
        <input id="api-key" type="password" placeholder="OpenAI API Key" />
      </div>
    </header>

    <main>
      <section id="tab-worlds" class="tab-panel active">
        <div class="panel">
          <h2>Select a World</h2>
          <div class="world-actions" style="margin-bottom:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <input id="creator-input" type="text" placeholder="Creator name or ID" />
            <button id="btn-generate-world">Generate World</button>
          </div>
          <div id="world-list" class="world-list"></div>
          <div id="world-error" class="error"></div>
        </div>
        <div class="panel" style="margin-top:12px;">
          <h2>Select a Player Character</h2>
          <div class="world-actions" style="margin-bottom:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <input id="pc-name-input" type="text" placeholder="New player character name" />
            <button id="btn-add-pc">Add Character</button>
          </div>
          <div id="pc-list" class="world-list"></div>
          <div id="pc-error" class="error"></div>
        </div>
      </section>

      <section id="tab-map" class="tab-panel">
        <div class="panel">
          <div class="map-header">
            <div>
              <strong>World:</strong> <span id="current-world-name">—</span>
            </div>
            <div class="coords-legend">
              Centered at (0,0); scroll to explore
            </div>
          </div>
          <div id="map-container" class="map-container">
            <div id="map-grid" class="map-grid"></div>
          </div>
          <div id="map-error" class="error"></div>
        </div>
      </section>

      <section id="tab-locale" class="tab-panel">
        <div class="panel">
          <div id="locale-header" class="locale-header"></div>
          <div class="locale-content">
            <div class="locale-overview">
              <div class="section-title">Overview</div>
              <div id="locale-overview"></div>
            </div>
            <div class="locale-buildings">
              <div class="section-title">Buildings</div>
              <div id="locale-buildings"></div>
            </div>
            <div class="locale-characters">
              <div class="section-title">Characters</div>
              <div id="locale-characters" class="character-list"></div>
            </div>
          </div>
          <div id="locale-error" class="error"></div>
        </div>
      </section>

      <section id="tab-biomes" class="tab-panel">
        <div class="panel">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
            <h2 style="margin:0;">Global Biomes</h2>
            <div>
              <button id="btn-generate-biome">Generate Biome</button>
            </div>
          </div>
          <div class="muted" style="margin:6px 0 10px 0;">
            Biomes are global building blocks. Generation uses the selected world as context if available.
          </div>
          <div id="biomes-list" class="world-list"></div>
          <div id="biomes-error" class="error"></div>
        </div>
      </section>

      <section id="tab-character" class="tab-panel">
        <div class="panel">
          <div id="character-header" class="character-header"></div>
          <div id="character-body" class="character-body"></div>
          <div class="system-prompt">
            <div class="section-title">System Prompt</div>
            <textarea id="system-prompt" readonly placeholder="System prompt will appear after you send a message..."></textarea>
          </div>
          <div class="commands-prompt">
            <div class="section-title">Command History</div>
            <textarea id="commands-history" readonly placeholder="Commands will appear after replies..."></textarea>
          </div>
          <div class="dialogue">
            <div id="dialogue-log" class="dialogue-log"></div>
            <div class="dialogue-input">
              <button id="btn-mic" title="Speak">🎤</button>
              <textarea id="dialogue-text" placeholder="Speak or type your message..."></textarea>
              <button id="btn-send" title="Send">Send</button>
            </div>
          </div>
          <div id="character-error" class="error"></div>
        </div>
      </section>

      <section id="tab-quests" class="tab-panel">
        <div class="panel">
          <div class="section-title">Accepted Quests</div>
          <div id="quests-list"></div>
          <div id="quests-error" class="error"></div>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" style="display:none;"></div>

    <script src="/prompt.js"></script>
    <script src="/context.js"></script>
    <script src="/commands.js"></script>
    <!-- Models must load before app.js -->
    <script src="/models/quest.js"></script>
    <script src="/models/character.js"></script>
    <!-- Order matters: primitives before Locale -->
    <script src="/models/locale.js"></script>
    <script src="/models/biome.js"></script>
    <script src="/models/player.js"></script>
    <script src="/models/game.js"></script>
    <script src="/app.js"></script>
  </body>
  </html>
